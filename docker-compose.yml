version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=AI Support Ticket Analytics
      - ENVIRONMENT=production
      - DATA_PATH=data/support_tickets.csv
      - DATABASE_PATH=data/support_tickets.db
      - LLM_PROVIDER=mock
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: .
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    volumes:
      - .:/app
    command: streamlit run ui/streamlit_app.py --server.address 0.0.0.0
